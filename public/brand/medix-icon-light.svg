<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="512" height="512" role="img">
  <title>MEDIx</title>
  <defs>
    <clipPath id="tile"><rect x="4" y="4" width="192" height="192" rx="48"/></clipPath>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.25"/>
    </linearGradient>
    <path id="A" d="M20 115 L20 15 L80 87" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path id="B" d="M100 115 L100 15 L40 87" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <mask id="onlyA" maskUnits="userSpaceOnUse" x="-20" y="-20" width="160" height="180">
      <use href="#A" stroke="#fff" stroke-width="15"/>
    </mask>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="200" height="200" fill="#ecfdf5"/>
    <circle cx="48" cy="44" r="46" fill="#f59e0b" fill-opacity="0.45" filter="url(#soft)"/>
    <circle cx="156" cy="160" r="54" fill="#10b981" fill-opacity="0.5" filter="url(#soft)"/>
    <rect width="200" height="200" fill="url(#sheen)"/>
  </g>
  <rect x="4" y="4" width="192" height="192" rx="48" fill="none" stroke="#fff" stroke-opacity="0.95" stroke-width="2"/>
  <rect x="3" y="3" width="194" height="194" rx="49" fill="none" stroke="#a7f3d0" stroke-opacity="0.8" stroke-width="1"/>

  <g transform="translate(22 15.5) scale(1.3)">
    <use href="#A" stroke="#fff" stroke-opacity="0.55" stroke-width="20"/>
    <use href="#A" stroke="#047857" stroke-opacity="0.9" stroke-width="15"/>
    <use href="#B" stroke="#fff" stroke-opacity="0.55" stroke-width="20"/>
    <use href="#B" stroke="#047857" stroke-opacity="0.9" stroke-width="15"/>
    <g mask="url(#onlyA)">
      <use href="#B" stroke="#f59e0b" stroke-opacity="0.96" stroke-width="15"/>
    </g>
  </g>
</svg>
